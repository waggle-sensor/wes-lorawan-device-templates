name: S_node
description: The S-NODE has been designed to support the broad suite of SDI-12 based environmental sensors and includes four on-board sensor inputs and the capacity to support additional sensors which are bussed externally. With a power system based upon either a 6.5 Ah or 13A h rechargeable lithium-ion battery or external DC power source, the S-NODE can support those sensors with higher power requirements.
